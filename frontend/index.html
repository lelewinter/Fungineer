<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Fungineer</title>

    <!-- PWA: manifest is emitted by vite-plugin-pwa as manifest.webmanifest -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS: standalone mode + fullscreen hints. iOS ignores the manifest's
         `display: fullscreen`; these meta tags are how you get the same on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fungineer" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS home-screen icon. iOS 16+ accepts SVG; older iOS falls back to
         the favicon. Replace with a 180x180 PNG if you need iOS 15 support. -->
    <link rel="apple-touch-icon" href="./pwa/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./pwa/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a14;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e6e6e6;
        font-feature-settings: "ss01" on;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #ui-overlay > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Fungineer</title>
    <style>
      :root {
        --bg: #0a0a14;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e6e6e6;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #ui-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #ui-overlay > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
